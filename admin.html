
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MFS VEXORA - Add Product</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      padding: 20px;
    }
    .panel {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 14px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
    }
    button {
      background: #111827;
      color: white;
      border: 0;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h2>MFS VEXORA</h2>
    <h3>Add New Product</h3>

    <form id="productForm">
      <input id="name" placeholder="Product Name" required>
      <input id="price" type="number" placeholder="Price" min="0" required>
      <input id="image" type="url" placeholder="Image URL" required>
      <input id="link" type="url" placeholder="Buy Now URL" required>
      <button type="submit">Add Product</button>
    </form>

    <p id="message"></p>
  </div>

  <script>
    const form = document.getElementById("productForm");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const products = JSON.parse(
        localStorage.getItem("mfsVexoraProducts") || "[]"
      );

      products.push({
        id: Date.now(),
        name: document.getElementById("name").value,
        price: document.getElementById("price").value,
        image: document.getElementById("image").value,
        link: document.getElementById("link").value
      });

      localStorage.setItem(
        "mfsVexoraProducts",
        JSON.stringify(products)
      );

      document.getElementById("message").textContent =
        "Product saved in this browser!";
      form.reset();
    });
  </script>
</body>
</html>
